# ========== 网络与安全 ==========
bind 0.0.0.0                    # 允许外部连接
protected-mode yes              # 生产环境开启保护模式
port 6379

# ========== 内存与淘汰策略==========
maxmemory 120mb                 # 限制最大内存，防止服务器被Redis挤爆
maxmemory-policy allkeys-lru    # 缓存场景标准策略

# ========== 持久化 ==========
appendonly yes
appendfsync everysec            # 行业标准，平衡性能与安全
aof-use-rdb-preamble yes        # 混合持久化，加快重启恢复速度

# ========== 慢日志监控==========
slowlog-log-slower-than 10000   # 记录超过10毫秒的命令
slowlog-max-len 128

# ========== 连接数 ==========
maxclients 10000