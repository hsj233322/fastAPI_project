# ========== 加载 Redis Stack 模块 ==========
loadmodule /opt/redis-stack/lib/redisearch.so

# ========== 网络与安全 ==========
bind 0.0.0.0
protected-mode no
port 6379

# ========== 内存与淘汰策略==========
maxmemory 300mb
maxmemory-policy allkeys-lru

# ========== 持久化 ==========
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes

# ========== 慢日志监控==========
slowlog-log-slower-than 10000
slowlog-max-len 128

# ========== 连接数 ==========
maxclients 10000